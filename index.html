<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WK 2026 Poule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
:root {
  --bg:      #141414;
  --bg2:     #1A1A1A;
  --bg3:     #222222;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text:    #E0E0E0;
  --text2:   #999;
  --text3:   #555;
  --orange:  #FF6B35;
  --orange2: #F7931E;
  --odim:    rgba(255,107,53,0.10);
  --oborder: rgba(255,107,53,0.28);
  --green:   #68D391;
  --red:     #E07070;
  --r:       8px;
  --rl:      12px;
  --font:    'DM Sans', sans-serif;
  --mono:    'DM Mono', monospace;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* HEADER */
header { position: sticky; top: 0; z-index: 100; background: rgba(20,20,20,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.hdr { max-width: 860px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; height: 54px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg,var(--orange),var(--orange2)); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.logo-text { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.2; }
.logo-sub { font-size: 11px; color: var(--text3); }
.user-area { display: flex; align-items: center; gap: 8px; }
.user-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
.user-sel { font-family: var(--font); font-size: 13px; background: var(--bg3); color: var(--text); border: 1px solid var(--border2); border-radius: var(--r); padding: 6px 10px; cursor: pointer; outline: none; max-width: 150px; }
.user-sel:focus { border-color: var(--orange); }

/* NAV */
.nav-bar { background: rgba(20,20,20,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.nav-bar::-webkit-scrollbar { display: none; }
.nav-inner { max-width: 860px; margin: 0 auto; padding: 0 16px; display: flex; }
.nav-tab { font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--text3); background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 16px 10px; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; margin-bottom: -1px; }
.nav-tab:hover { color: var(--text2); }
.nav-tab.active { color: var(--orange); border-bottom-color: var(--orange); }

/* MAIN */
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
.panel { display: none; }
.panel.active { display: block; }

/* SECTION HEADER */
.sec-hd { margin-bottom: 20px; }
.sec-title { font-size: 20px; font-weight: 600; color: var(--text); }
.sec-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }

/* STAND */
.stand-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); overflow: hidden; }
.stand-hd { display: grid; grid-template-columns: 28px 1fr 50px 34px 34px 34px; gap: 8px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--border); }
.stand-hd span { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); }
.stand-row { display: grid; grid-template-columns: 28px 1fr 50px 34px 34px 34px; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background .12s; }
.stand-row:last-child { border: none; }
.stand-row:hover { background: rgba(255,255,255,0.02); }
.s-rank { font-size: 13px; font-weight: 600; color: var(--text3); text-align: center; }
.s-rank.r1 { color: var(--orange); }
.s-rank.r2 { color: #C0C0C0; }
.s-rank.r3 { color: #CD7F32; }
.s-player { display: flex; align-items: center; gap: 9px; min-width: 0; }
.s-av { width: 34px; height: 34px; border-radius: 50%; background: var(--bg3); border: 2px solid var(--border2); color: var(--text2); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.s-av.me { border-color: var(--oborder); background: var(--odim); color: var(--orange); }
.s-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-champ { font-size: 11px; color: var(--text3); margin-top: 1px; }
.s-pts { font-size: 18px; font-weight: 700; color: var(--orange); text-align: right; font-family: var(--mono); }
.s-stat { font-size: 13px; text-align: center; color: var(--text3); }
.s-stat.g { color: var(--green); }
.s-stat.r { color: var(--red); }

/* FILTER */
.filter-row { display: flex; gap: 7px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filter-row::-webkit-scrollbar { display: none; }
.fpill { font-family: var(--font); font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 100px; border: 1px solid var(--border2); background: none; color: var(--text3); cursor: pointer; white-space: nowrap; transition: all .15s; }
.fpill:hover { color: var(--text); border-color: var(--text3); }
.fpill.active { background: var(--orange); border-color: var(--orange); color: #141414; font-weight: 600; }

/* ROUND LABEL */
.round-lbl { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); margin: 22px 0 10px; }
.round-lbl:first-of-type { margin-top: 0; }

/* MATCH CARD */
.match-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 14px 16px; margin-bottom: 9px; transition: border-color .15s; }
.match-card:hover { border-color: rgba(255,107,53,0.2); }
.match-card.live { border-color: rgba(255,107,53,0.38); background: linear-gradient(135deg,rgba(255,107,53,0.05) 0%,var(--bg2) 60%); }
.match-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.match-meta-l { font-size: 11px; color: var(--text3); }
.live-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--orange); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); animation: pulse 1.1s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)} }
.done-badge { font-size: 11px; color: var(--green); font-weight: 500; }
.up-badge { font-size: 11px; color: var(--text3); }
.teams-row { display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center; gap: 6px; margin-bottom: 10px; }
.team-side { display: flex; align-items: center; gap: 7px; min-width: 0; }
.team-side.r { flex-direction: row-reverse; }
.flag { font-size: 22px; line-height: 1; flex-shrink: 0; }
.tname { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score-box { text-align: center; }
.score-num { font-size: 26px; font-weight: 700; font-family: var(--mono); letter-spacing: 2px; line-height: 1; white-space: nowrap; }
.score-num.live { color: var(--orange); }
.score-num.up { color: var(--bg3); }
.score-note { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-top: 2px; }
.stadium-line { font-size: 10px; color: var(--text3); margin-bottom: 9px; }
.pred-section { border-top: 1px solid var(--border); padding-top: 10px; }
.pred-lbl { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 7px; }
.pred-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pp { font-size: 11px; font-family: var(--mono); padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text3); white-space: nowrap; }
.pp.me { border-color: var(--oborder); background: var(--odim); color: var(--orange); }
.pp.exact { border-color: rgba(104,211,145,.4); background: rgba(104,211,145,.07); color: var(--green); }
.pp.correct { border-color: rgba(104,211,145,.2); background: rgba(104,211,145,.04); color: #7DCCA0; }
.pp.wrong { border-color: rgba(224,112,112,.25); background: rgba(224,112,112,.04); color: #C08080; }
.pp.pending { opacity: .55; }

/* VOORSPELLEN */
.bonus-card { background: var(--bg2); border: 1px solid var(--oborder); border-radius: var(--rl); padding: 20px; margin-bottom: 18px; }
.bonus-title { font-size: 15px; font-weight: 600; color: var(--orange); margin-bottom: 4px; }
.bonus-desc { font-size: 12px; color: var(--text3); margin-bottom: 18px; line-height: 1.7; }
.bonus-field { margin-bottom: 18px; }
.field-lbl { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; display: block; }
.team-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 7px; max-height: 250px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--bg3) transparent; }
.team-btn { display: flex; align-items: center; gap: 7px; font-family: var(--font); font-size: 13px; padding: 7px 11px; border-radius: var(--r); border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); cursor: pointer; transition: all .15s; text-align: left; white-space: nowrap; overflow: hidden; }
.team-btn:hover { border-color: var(--oborder); color: var(--text); }
.team-btn.sel { border-color: var(--orange); background: var(--odim); color: var(--orange); }
.scorer-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.scorer-num { font-family: var(--mono); font-size: 16px; color: var(--orange); width: 20px; text-align: center; flex-shrink: 0; }
.scorer-inp { flex: 1; font-family: var(--font); font-size: 14px; background: var(--bg3); color: var(--text); border: 1px solid var(--border2); border-radius: var(--r); padding: 8px 11px; outline: none; transition: border-color .15s; }
.scorer-inp:focus { border-color: var(--orange); }
.predict-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 14px 16px; margin-bottom: 9px; }
.pred-teams-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-bottom: 8px; }
.pred-team { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; }
.pred-team.r { flex-direction: row-reverse; }
.score-inputs { display: flex; align-items: center; gap: 6px; }
.score-inp { width: 44px; height: 46px; text-align: center; font-family: var(--mono); font-size: 24px; background: var(--bg3); color: var(--text); border: 1px solid var(--border2); border-radius: var(--r); outline: none; transition: border-color .15s; -moz-appearance: textfield; }
.score-inp::-webkit-outer-spin-button, .score-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
.score-inp:focus { border-color: var(--orange); }
.score-dash { font-family: var(--mono); font-size: 20px; color: var(--text3); }
.pen-row { display: none; align-items: center; gap: 9px; margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text3); flex-wrap: wrap; }
.pen-row.show { display: flex; }
.pen-btns { display: flex; gap: 6px; }
.pen-btn { font-family: var(--font); font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 100px; border: 1px solid var(--border2); background: none; color: var(--text3); cursor: pointer; transition: all .15s; white-space: nowrap; }
.pen-btn.sel { background: var(--orange); border-color: var(--orange); color: #141414; }
.save-btn { width: 100%; padding: 13px; font-family: var(--font); font-size: 15px; font-weight: 600; background: var(--orange); color: #141414; border: none; border-radius: var(--rl); cursor: pointer; transition: all .15s; margin-top: 14px; }
.save-btn:hover { background: #FF8855; transform: translateY(-1px); }
.save-btn:active { transform: translateY(0); }
.save-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* REGELS */
.rules-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 11px; margin-bottom: 20px; }
.rule-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 18px; }
.rule-pts { font-size: 36px; font-weight: 700; color: var(--orange); font-family: var(--mono); line-height: 1; margin-bottom: 6px; }
.rule-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.rule-desc { font-size: 12px; color: var(--text3); line-height: 1.6; }

/* ALERTS */
.alert { padding: 11px 14px; border-radius: var(--r); font-size: 13px; line-height: 1.6; margin-bottom: 16px; display: flex; gap: 9px; }
.alert-info { background: var(--odim); border: 1px solid var(--oborder); color: var(--orange); }
.alert-warn { background: rgba(232,184,75,.08); border: 1px solid rgba(232,184,75,.25); color: #E8B84B; }
.alert a { color: inherit; }

/* LOADING / EMPTY */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 14px; color: var(--text3); font-size: 13px; }
.spinner { width: 30px; height: 30px; border: 2px solid var(--bg3); border-top-color: var(--orange); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 13px; line-height: 2; }

/* TOAST */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--bg2); border: 1px solid var(--border2); color: var(--text); font-size: 13px; padding: 10px 22px; border-radius: 100px; z-index: 999; transition: transform .3s cubic-bezier(.4,0,.2,1); white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,.5); pointer-events: none; }
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.success { border-color: rgba(104,211,145,.4); color: var(--green); }
#toast.error { border-color: rgba(224,112,112,.4); color: var(--red); }

/* RESPONSIVE */
@media (max-width: 580px) {
  .stand-row, .stand-hd { grid-template-columns: 24px 1fr 44px 30px 30px; }
  .stand-row .s-stat:last-child, .stand-hd span:last-child { display: none; }
  .teams-row { grid-template-columns: 1fr 86px 1fr; }
  .flag { font-size: 20px; }
  .tname { font-size: 13px; }
  .score-num { font-size: 22px; }
  .score-inp { width: 40px; height: 42px; font-size: 20px; }
  .pred-team { font-size: 13px; }
}
</style>
</head>

<script>
/* ══════════════════════════════════════════
   CONFIGURATIE
══════════════════════════════════════════ */
const SB_URL     = 'https://zrdsgbwdpiypwtnhzjyq.supabase.co';
const SB_KEY     = 'sb_publishable_O5W1_62Xfl_tpl1NYteg2Q_26eBdM88';

// Proxy URL (Vercel) — football-data.org via server-side
const PROXY_URL  = 'https://wk-2026-eta.vercel.app/api/scores';

// Testmodus: true = WK 2022 data, false = WK 2026 live
// Zet op false zodra WK 2026 begint (11 juni 2026)
const TESTMODUS  = true;

const DEELNEMERS = JSON.parse(localStorage.getItem('wk26_deelnemers') || 'null')
  || ['Wouter','Anne-Charlotte','Maurits','Florine','Papa','Mama'];

const PUNTEN = JSON.parse(localStorage.getItem('wk26_punten_config') || 'null') || {
  exact:5, winnaar:3, kampioen:10, finalist:5, scorer1:8, scorer2:5, scorer3:3
};

/* ══════════════════════════════════════════
   WK 2026 TEAMS — echte groepsindeling
══════════════════════════════════════════ */
const GROEPEN = {
  A:[{naam:'Mexico',vlag:'🇲🇽'},{naam:'Zuid-Afrika',vlag:'🇿🇦'},{naam:'Zuid-Korea',vlag:'🇰🇷'},{naam:'Tsjechië',vlag:'🇨🇿'}],
  B:[{naam:'Canada',vlag:'🇨🇦'},{naam:'Bosnië-Herz.',vlag:'🇧🇦'},{naam:'Qatar',vlag:'🇶🇦'},{naam:'Zwitserland',vlag:'🇨🇭'}],
  C:[{naam:'Brazilië',vlag:'🇧🇷'},{naam:'Marokko',vlag:'🇲🇦'},{naam:'Haïti',vlag:'🇭🇹'},{naam:'Schotland',vlag:'🏴󠁧󠁢󠁳󠁣󠁴󠁿'}],
  D:[{naam:'USA',vlag:'🇺🇸'},{naam:'Paraguay',vlag:'🇵🇾'},{naam:'Australië',vlag:'🇦🇺'},{naam:'Turkije',vlag:'🇹🇷'}],
  E:[{naam:'Duitsland',vlag:'🇩🇪'},{naam:'Curaçao',vlag:'🇨🇼'},{naam:'Ivoorkust',vlag:'🇨🇮'},{naam:'Ecuador',vlag:'🇪🇨'}],
  F:[{naam:'Nederland',vlag:'🇳🇱'},{naam:'Japan',vlag:'🇯🇵'},{naam:'Zweden',vlag:'🇸🇪'},{naam:'Tunesië',vlag:'🇹🇳'}],
  G:[{naam:'België',vlag:'🇧🇪'},{naam:'Egypte',vlag:'🇪🇬'},{naam:'Iran',vlag:'🇮🇷'},{naam:'Nieuw-Zeeland',vlag:'🇳🇿'}],
  H:[{naam:'Spanje',vlag:'🇪🇸'},{naam:'Kaapverdië',vlag:'🇨🇻'},{naam:'Saoedi-Arabië',vlag:'🇸🇦'},{naam:'Uruguay',vlag:'🇺🇾'}],
  I:[{naam:'Frankrijk',vlag:'🇫🇷'},{naam:'Senegal',vlag:'🇸🇳'},{naam:'Irak',vlag:'🇮🇶'},{naam:'Noorwegen',vlag:'🇳🇴'}],
  J:[{naam:'Argentinië',vlag:'🇦🇷'},{naam:'Algerije',vlag:'🇩🇿'},{naam:'Oostenrijk',vlag:'🇦🇹'},{naam:'Jordanië',vlag:'🇯🇴'}],
  K:[{naam:'Portugal',vlag:'🇵🇹'},{naam:'DR Congo',vlag:'🇨🇩'},{naam:'Oezbekistan',vlag:'🇺🇿'},{naam:'Colombia',vlag:'🇨🇴'}],
  L:[{naam:'Engeland',vlag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿'},{naam:'Kroatië',vlag:'🇭🇷'},{naam:'Ghana',vlag:'🇬🇭'},{naam:'Panama',vlag:'🇵🇦'}],
};
const ALL_TEAMS = Object.entries(GROEPEN).flatMap(([g,t])=>t.map(x=>({...x,groep:g})));
function teamVlag(naam){
  const zoek = naam.toLowerCase();
  return ALL_TEAMS.find(t=>zoek.includes(t.naam.toLowerCase().split(' ')[0].toLowerCase()))?.vlag || '🏳️';
}

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let huidigSpeler = localStorage.getItem('wk26_speler') || '';
let wedstrijden  = [];
let voorspellingen = {};
let bonusData    = {};
let stand        = [];
let activeTab    = 'stand';
let activeFilter = 'alles';
let penSelecties = {};
let bonusSel     = {};

/* ══════════════════════════════════════════
   SUPABASE
══════════════════════════════════════════ */
async function sbFetch(method, table, body=null, query='') {
  const key = localStorage.getItem('wk26_sb_key') || '';
  if (!key) throw new Error('geen_key — stel Supabase key in via admin.html');
  const r = await fetch(`${SB_URL}/rest/v1/${table}${query}`, {
    method,
    headers: {
      'apikey': key, 'Authorization': `Bearer ${key}`,
      'Content-Type': 'application/json',
      'Prefer': method==='POST' ? 'resolution=merge-duplicates,return=representation' : 'return=representation',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(r.status);
  return r.headers.get('content-type')?.includes('json') ? r.json() : [];
}
const sbGet    = (t,q='') => sbFetch('GET',t,null,q);
const sbUpsert = (t,d)    => sbFetch('POST',t,d);

/* ══════════════════════════════════════════
   SCORES OPHALEN VIA VERCEL PROXY
══════════════════════════════════════════ */
async function fetchScores() {
  try {
    const r = await fetch(PROXY_URL);
    if (!r.ok) return [];
    const d = await r.json();
    return (d.matches || []).map(m => ({
      id: m.id,
      datum: new Date(m.utcDate),
      fase: m.stage,
      isKO: !['GROUP_STAGE'].includes(m.stage),
      thuis: { naam: m.homeTeam.shortName || m.homeTeam.name, vlag: teamVlag(m.homeTeam.name) },
      uit:   { naam: m.awayTeam.shortName || m.awayTeam.name, vlag: teamVlag(m.awayTeam.name) },
      groep: m.group?.replace('GROUP_','').replace('_STAGE','') || null,
      stadion: m.venue || '',
      status: m.status,
      minuut: m.minute || null,
      score: { thuis: m.score.fullTime.home, uit: m.score.fullTime.away },
      scoreNa90: {
        thuis: m.score.regularTime?.home ?? m.score.fullTime.home,
        uit:   m.score.regularTime?.away ?? m.score.fullTime.away,
      },
      penalties: m.score.penalties
        ? { thuis: m.score.penalties.home, uit: m.score.penalties.away }
        : null,
    }));
  } catch { return []; }
}

/* ══════════════════════════════════════════
   PUNTEN
══════════════════════════════════════════ */
function berekenPunten(match, v) {
  if (match.status !== 'FINISHED' || !v) return null;
  if (v.thuis == null || v.uit == null) return 0;
  const et = match.scoreNa90.thuis, eu = match.scoreNa90.uit;
  if (v.thuis === et && v.uit === eu) return PUNTEN.exact;
  const ew = et > eu ? 'thuis' : eu > et ? 'uit' : 'gelijk';
  const vw = v.thuis > v.uit ? 'thuis' : v.uit > v.thuis ? 'uit' : 'gelijk';
  if (match.isKO && ew === 'gelijk' && match.penalties) {
    const epw = match.penalties.thuis > match.penalties.uit ? 'thuis' : 'uit';
    return v.penWinnaar === epw ? PUNTEN.winnaar : 0;
  }
  return vw === ew ? PUNTEN.winnaar : 0;
}

function berekenStand() {
  const tot = {};
  DEELNEMERS.forEach(s => { tot[s] = {punten:0,exact:0,winnaar:0,fout:0}; });
  wedstrijden.filter(m=>m.status==='FINISHED').forEach(match => {
    const mv = voorspellingen[match.id] || {};
    DEELNEMERS.forEach(sp => {
      const pts = berekenPunten(match, mv[sp]);
      if (pts === null) return;
      tot[sp].punten += pts;
      if (pts === PUNTEN.exact) tot[sp].exact++;
      else if (pts === PUNTEN.winnaar) tot[sp].winnaar++;
      else tot[sp].fout++;
    });
  });
  stand = DEELNEMERS
    .map(s => ({naam:s,...tot[s],bonus:bonusData[s]||{}}))
    .sort((a,b) => b.punten-a.punten || b.exact-a.exact);
}

/* ══════════════════════════════════════════
   DATA LADEN
══════════════════════════════════════════ */
async function laadAlles() {
  try {
    const [vRows, bRows, scores] = await Promise.all([
      sbGet('voorspellingen','?select=*'),
      sbGet('bonus','?select=*'),
      fetchScores(),
    ]);
    voorspellingen = {};
    vRows.forEach(r => {
      if (!voorspellingen[r.match_id]) voorspellingen[r.match_id] = {};
      voorspellingen[r.match_id][r.speler] = {thuis:r.score_thuis,uit:r.score_uit,penWinnaar:r.pen_winnaar};
    });
    bonusData = {};
    bRows.forEach(r => {
      bonusData[r.speler] = {kampioen:r.kampioen,finalist:r.finalist,scorers:[r.scorer1,r.scorer2,r.scorer3].filter(Boolean)};
    });
    // Gebruik live scores als die beschikbaar zijn, anders vaste WK 2026 lijst
    wedstrijden = scores.length ? scores : wk2026Wedstrijden();
  } catch {
    // Supabase niet bereikbaar — toon wel wedstrijden
    wedstrijden = wk2026Wedstrijden();
  }
  berekenStand();
  renderActief();
}

function renderStand() {
  const gespeeld = wedstrijden.filter(m=>m.status==='FINISHED').length;
  let h = `<div class="sec-hd"><div class="sec-title">Ranglijst</div>
    <div class="sec-sub">${gespeeld} wedstrijden gespeeld · ${DEELNEMERS.length} deelnemers${TESTMODUS?' · <span style="color:var(--orange)">testmodus WK 2022</span>':''}</div></div>`;

  if (!SB_KEY && !localStorage.getItem('wk26_sb_key')) {
    h += `<div class="alert alert-warn">⚙️ Supabase key ontbreekt — ga naar <a href="admin.html"><strong>Admin → Supabase setup</strong></a> om de key in te stellen.</div>`;
  }

  h += `<div class="stand-card">
    <div class="stand-hd"><span>#</span><span>Naam</span><span style="text-align:right">Ptn</span><span style="text-align:center">✓✓</span><span style="text-align:center">✓</span><span style="text-align:center">✗</span></div>`;

  if (!stand.length) {
    h += `<div class="empty">Nog geen data beschikbaar.</div>`;
  } else {
    stand.forEach((s,i) => {
      const rc = i===0?'r1':i===1?'r2':i===2?'r3':'';
      const isMe = s.naam===huidigSpeler;
      h += `<div class="stand-row">
        <div class="s-rank ${rc}">${i+1}</div>
        <div class="s-player">
          <div class="s-av ${isMe?'me':''}">${s.naam.slice(0,2).toUpperCase()}</div>
          <div><div class="s-name">${s.naam}</div>
          <div class="s-champ">${s.bonus?.kampioen?'🏆 '+s.bonus.kampioen:'—'}</div></div>
        </div>
        <div class="s-pts">${s.punten}</div>
        <div class="s-stat g">${s.exact}</div>
        <div class="s-stat">${s.winnaar}</div>
        <div class="s-stat r">${s.fout}</div>
      </div>`;
    });
  }
  h += `</div>`;
  document.getElementById('panel-stand').innerHTML = h;
}

/* ══════════════════════════════════════════
   RENDER WEDSTRIJDEN
══════════════════════════════════════════ */
function renderWedstrijden() {
  let h = `<div class="sec-hd"><div class="sec-title">Wedstrijden</div>
    <div class="sec-sub">Live uitslagen en voorspellingen${TESTMODUS?' · testdata WK 2022':''}</div></div>
  <div class="filter-row">
    ${['alles','live','groepsfase','knock-out','afgespeeld'].map(f=>
      `<button class="fpill ${activeFilter===f?'active':''}" onclick="setFilter('${f}')">${f==='live'?'🔴 Live':f.charAt(0).toUpperCase()+f.slice(1)}</button>`
    ).join('')}
  </div>`;

  let lijst = [...wedstrijden];
  if (activeFilter==='live')       lijst=lijst.filter(m=>m.status==='IN_PLAY');
  if (activeFilter==='groepsfase') lijst=lijst.filter(m=>!m.isKO);
  if (activeFilter==='knock-out')  lijst=lijst.filter(m=>m.isKO);
  if (activeFilter==='afgespeeld') lijst=lijst.filter(m=>m.status==='FINISHED');

  if (!lijst.length) {
    h += `<div class="empty">Geen wedstrijden gevonden.<br>Controleer of de Vercel proxy werkt.</div>`;
  } else {
    const fasen = [...new Set(lijst.map(m=>faseNaam(m)))];
    fasen.forEach(fase => {
      h += `<div class="round-lbl">${fase}</div>`;
      lijst.filter(m=>faseNaam(m)===fase).forEach(match => { h += matchCardHTML(match); });
    });
  }

  document.getElementById('panel-wedstrijden').innerHTML = h;
}

function faseNaam(m) {
  const map = {GROUP_STAGE:'Groepsfase',ROUND_OF_32:'Ronde van 32',ROUND_OF_16:'Achtste finales',QUARTER_FINALS:'Kwartfinales',SEMI_FINALS:'Halve finales',THIRD_PLACE:'3e plaatswedstrijd',FINAL:'⚽ Finale'};
  return map[m.fase] || m.fase || 'Overig';
}

function matchCardHTML(match) {
  const isLive = match.status==='IN_PLAY';
  const isDone = match.status==='FINISHED';
  const datum  = match.datum.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'})
               + ' · ' + match.datum.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  const badge  = isLive
    ? `<span class="live-badge"><span class="live-dot"></span>LIVE ${match.minuut?match.minuut+"'":''}  </span>`
    : isDone ? `<span class="done-badge">✓ Afgespeeld</span>`
    : `<span class="up-badge">${match.datum.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</span>`;

  let snum = (!isLive && !isDone)
    ? `<div class="score-num up">– –</div>`
    : `<div class="score-num ${isLive?'live':''}">${match.score.thuis} – ${match.score.uit}</div>`;
  let snote = '';
  if (isDone && match.isKO && match.penalties)
    snote = `<div class="score-note">pen. ${match.penalties.thuis}–${match.penalties.uit}</div>`;
  else if (isDone && match.isKO)
    snote = `<div class="score-note">na 120'</div>`;

  const mv = voorspellingen[match.id] || {};
  let predsHTML = '';
  if (isDone || isLive || Object.keys(mv).length) {
    const pills = DEELNEMERS.map(sp => {
      const v = mv[sp];
      const isMe = sp===huidigSpeler;
      if (!v) return `<span class="pp pending ${isMe?'me':''}">${sp}: –</span>`;
      const pts = berekenPunten(match, v);
      let cls = isMe ? 'me' : '';
      if (isDone) {
        if (pts===PUNTEN.exact) cls+=' exact';
        else if (pts===PUNTEN.winnaar) cls+=' correct';
        else if (pts===0) cls+=' wrong';
      }
      let lbl = `${v.thuis}–${v.uit}`;
      if (match.isKO && v.penWinnaar) lbl+=` (${v.penWinnaar==='thuis'?match.thuis.naam:match.uit.naam})`;
      if (isDone && pts!==null) lbl += pts>0 ? ` +${pts}` : ' ✗';
      return `<span class="pp ${cls.trim()}">${sp}: ${lbl}</span>`;
    }).join('');
    predsHTML = `<div class="pred-section"><div class="pred-lbl">Voorspellingen</div><div class="pred-pills">${pills}</div></div>`;
  }

  const groepLbl = match.groep ? `Groep ${match.groep} · ` : '';
  const stadLbl  = match.stadion ? `<div class="stadium-line">📍 ${match.stadion}</div>` : '';

  return `<div class="match-card ${isLive?'live':''}">
    <div class="match-meta"><span class="match-meta-l">${groepLbl}${datum}</span>${badge}</div>
    ${stadLbl}
    <div class="teams-row">
      <div class="team-side"><span class="flag">${match.thuis.vlag}</span><span class="tname">${match.thuis.naam}</span></div>
      <div class="score-box">${snum}${snote}</div>
      <div class="team-side r"><span class="flag">${match.uit.vlag}</span><span class="tname">${match.uit.naam}</span></div>
    </div>
    ${predsHTML}
  </div>`;
}

/* ══════════════════════════════════════════
   RENDER VOORSPELLEN
══════════════════════════════════════════ */
function renderVoorspellen() {
  let h = `<div class="sec-hd"><div class="sec-title">Voorspellen</div>
    <div class="sec-sub">Jouw invoer · ${huidigSpeler||'—'}</div></div>`;

  if (!huidigSpeler) {
    h += `<div class="alert alert-info">👆 Selecteer eerst je naam rechtsboven.</div>`;
    document.getElementById('panel-voorspellen').innerHTML = h;
    return;
  }

  h += renderBonusForm();

  const open = wedstrijden.filter(m=>m.status==='SCHEDULED'||m.status==='TIMED');
  if (!open.length) {
    h += `<div class="empty">Geen openstaande wedstrijden.<br>Alles is gespeeld of live.</div>`;
    document.getElementById('panel-voorspellen').innerHTML = h;
    return;
  }

  h += `<div class="round-lbl" style="margin-top:24px">Openstaande wedstrijden</div>`;
  open.forEach(match => {
    const v = (voorspellingen[match.id]||{})[huidigSpeler]||{};
    const ko = match.isKO;
    const datum = match.datum.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
    h += `<div class="predict-card">
      <div class="match-meta" style="margin-bottom:10px">
        <span class="match-meta-l">${datum}${match.stadion?' · '+match.stadion:''}</span>
        <span class="up-badge">${faseNaam(match)}</span>
      </div>
      <div class="pred-teams-row">
        <div class="pred-team"><span class="flag">${match.thuis.vlag}</span>${match.thuis.naam}</div>
        <div class="score-inputs">
          <input class="score-inp" type="number" min="0" max="20" id="si-${match.id}-t"
            value="${v.thuis??''}" placeholder="0" ${ko?`oninput="checkKO(${match.id})"`:''} />
          <span class="score-dash">–</span>
          <input class="score-inp" type="number" min="0" max="20" id="si-${match.id}-u"
            value="${v.uit??''}" placeholder="0" ${ko?`oninput="checkKO(${match.id})"`:''} />
        </div>
        <div class="pred-team r"><span class="flag">${match.uit.vlag}</span>${match.uit.naam}</div>
      </div>
      ${ko?`<div class="pen-row" id="pen-${match.id}">
        <span>Strafschoppen wint:</span>
        <div class="pen-btns">
          <button class="pen-btn ${v.penWinnaar==='thuis'?'sel':''}" id="pb-${match.id}-t"
            onclick="selPen(${match.id},'thuis')">${match.thuis.naam}</button>
          <button class="pen-btn ${v.penWinnaar==='uit'?'sel':''}" id="pb-${match.id}-u"
            onclick="selPen(${match.id},'uit')">${match.uit.naam}</button>
        </div>
      </div>`:''}
    </div>`;
  });

  h += `<button class="save-btn" onclick="slaOp()">Voorspellingen opslaan</button>`;
  document.getElementById('panel-voorspellen').innerHTML = h;
  open.filter(m=>m.isKO).forEach(m=>checkKO(m.id));
}

function renderBonusForm() {
  const b = bonusData[huidigSpeler]||{};
  const sc = b.scorers||['','',''];
  let h = `<div class="bonus-card">
    <div class="bonus-title">⭐ Bonusvragen</div>
    <div class="bonus-desc">Vul in vóór 11 juni 2026 · Kampioen <strong style="color:var(--orange)">${PUNTEN.kampioen}pts</strong> · Finalist <strong style="color:var(--orange)">${PUNTEN.finalist}pts</strong> · Topscorer <strong style="color:var(--orange)">${PUNTEN.scorer1}/${PUNTEN.scorer2}/${PUNTEN.scorer3}pts</strong></div>
    <div class="bonus-field"><label class="field-lbl">Wereldkampioen</label><div class="team-grid">`;
  ALL_TEAMS.forEach(t => { h+=`<button class="team-btn ${b.kampioen===t.naam?'sel':''}" onclick="selBonus('kampioen','${t.naam}',this)">${t.vlag} ${t.naam}</button>`; });
  h += `</div></div><div class="bonus-field"><label class="field-lbl">Finalist (verliezend)</label><div class="team-grid">`;
  ALL_TEAMS.forEach(t => { h+=`<button class="team-btn ${b.finalist===t.naam?'sel':''}" onclick="selBonus('finalist','${t.naam}',this)">${t.vlag} ${t.naam}</button>`; });
  h += `</div></div>
    <div class="bonus-field"><label class="field-lbl">Top 3 Topscorers</label>
      ${[1,2,3].map(n=>`<div class="scorer-row"><span class="scorer-num">${n}</span><input class="scorer-inp" id="sc${n}" type="text" placeholder="Naam speler" value="${sc[n-1]||''}"></div>`).join('')}
    </div>
    <button class="save-btn" onclick="slaBonus()" style="margin-top:4px">Bonusvragen opslaan</button>
  </div>`;
  return h;
}

function selBonus(veld, waarde, btn) {
  bonusSel[veld] = waarde;
  btn.closest('.team-grid').querySelectorAll('.team-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

async function slaBonus() {
  if (!huidigSpeler) { toast('Kies eerst je naam rechtsboven','error'); return; }
  const key = localStorage.getItem('wk26_sb_key') || '';
  if (!key) { toast('Geen Supabase key — stel in via admin.html → Supabase setup','error'); return; }
  const row = {
    speler:   huidigSpeler,
    kampioen: bonusSel.kampioen || bonusData[huidigSpeler]?.kampioen || null,
    finalist: bonusSel.finalist || bonusData[huidigSpeler]?.finalist || null,
    scorer1:  document.getElementById('sc1')?.value.trim() || null,
    scorer2:  document.getElementById('sc2')?.value.trim() || null,
    scorer3:  document.getElementById('sc3')?.value.trim() || null,
  };
  try {
    await sbUpsert('bonus', [row]);
    bonusData[huidigSpeler] = { kampioen:row.kampioen, finalist:row.finalist, scorers:[row.scorer1,row.scorer2,row.scorer3].filter(Boolean) };
    berekenStand();
    toast('Bonusvragen opgeslagen ✓','success');
  } catch(e) {
    console.error('Bonus opslaan mislukt:', e);
    toast(`Opslaan mislukt (${e.message}) — check Supabase verbinding`,'error');
  }
}

function checkKO(matchId) {
  const t = parseInt(document.getElementById(`si-${matchId}-t`)?.value);
  const u = parseInt(document.getElementById(`si-${matchId}-u`)?.value);
  document.getElementById(`pen-${matchId}`)?.classList.toggle('show', !isNaN(t)&&!isNaN(u)&&t===u);
}

function selPen(matchId, kant) {
  penSelecties[matchId] = kant;
  document.getElementById(`pb-${matchId}-t`)?.classList.toggle('sel', kant==='thuis');
  document.getElementById(`pb-${matchId}-u`)?.classList.toggle('sel', kant==='uit');
}

async function slaOp() {
  if (!huidigSpeler) { toast('Kies eerst je naam','error'); return; }
  const key = localStorage.getItem('wk26_sb_key') || '';
  if (!key) { toast('Geen Supabase key — stel in via admin.html → Supabase setup','error'); return; }
  const btn = document.querySelector('.save-btn');
  if (btn) { btn.disabled=true; btn.textContent='Bezig…'; }
  const open = wedstrijden.filter(m=>m.status==='SCHEDULED'||m.status==='TIMED');
  const rows = [];
  open.forEach(match => {
    const tv = document.getElementById(`si-${match.id}-t`);
    const uv = document.getElementById(`si-${match.id}-u`);
    if (!tv||!uv||tv.value===''||uv.value==='') return;
    const t=parseInt(tv.value), u=parseInt(uv.value);
    if (isNaN(t)||isNaN(u)) return;
    const pen = t===u&&match.isKO ? (penSelecties[match.id]||(voorspellingen[match.id]?.[huidigSpeler]?.penWinnaar)||null) : null;
    rows.push({match_id:match.id,speler:huidigSpeler,score_thuis:t,score_uit:u,pen_winnaar:pen});
  });
  try {
    await sbUpsert('voorspellingen',rows);
    rows.forEach(r => {
      if (!voorspellingen[r.match_id]) voorspellingen[r.match_id]={};
      voorspellingen[r.match_id][r.speler]={thuis:r.score_thuis,uit:r.score_uit,penWinnaar:r.pen_winnaar};
    });
    berekenStand();
    toast(`${rows.length} voorspelling(en) opgeslagen ✓`,'success');
  } catch { toast('Fout bij opslaan — check verbinding','error'); }
  finally { if (btn){btn.disabled=false;btn.textContent='Voorspellingen opslaan';} }
}

/* ══════════════════════════════════════════
   NAVIGATIE & UTILS
══════════════════════════════════════════ */
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
  if (tab==='stand')       renderStand();
  if (tab==='wedstrijden') renderWedstrijden();
  if (tab==='voorspellen') renderVoorspellen();
  if (tab==='regels')      renderRegels();
}

function setFilter(f) { activeFilter=f; renderWedstrijden(); }
function renderActief() { switchTab(activeTab); }

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className=`show ${type}`;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3000);
}

document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('user-sel');
  DEELNEMERS.forEach(n => {
    const o = document.createElement('option');
    o.value=n; o.textContent=n;
    if (n===huidigSpeler) o.selected=true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => {
    huidigSpeler=sel.value;
    localStorage.setItem('wk26_speler',huidigSpeler);
    renderActief();
  });
  laadAlles();
  setInterval(laadAlles, 60000);
});
